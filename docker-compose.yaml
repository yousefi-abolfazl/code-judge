version: '3.8'

services:
  db:
    image: postgres:16-alpine # Using a smaller alpine image
    environment:
      POSTGRES_USER: yousef
      POSTGRES_PASSWORD: code-judge123
      POSTGRES_DB: code_judge
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yousef -d code_judge"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: ["./code-judge", "serve", "--config", "./config/config.yaml"]
    ports:
      - "8888:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: on-failure

  runner:
    build:
      context: ./backend # Runner now uses the same Dockerfile
      dockerfile: Dockerfile
      args: 
        DOCKER_GID: ${DOCKER_GID:-1001}
    command: ["./code-judge", "runner", "--config", "./config/config.yaml"]
    depends_on:
      - backend
      - db # Runner might need to check problems, so better to depend on db too
    networks:
      - app-network
    volumes:
      # Mount docker sock to allow runner to create containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Named volume for temporary submission files
      - runner-temp:/tmp/runner
    restart: on-failure
    security_opt:
      - "label:disable"

  # Frontend service remains the same
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "2020:2020"
  #   depends_on:
  #     - backend
  #   networks:
  #     - app-network
  #   restart: on-failure

volumes:
  db-data:
  runner-temp:

networks:
  app-network:
    driver: bridge